services:
  # --- Workflow engine core ---
  engine: 
    build: containers/core/engine
    #healthcheck:
    #  test: ["CMD", "curl", "-f", "http://engine:8080/engine-rest/engine"]
    #  interval: 5s
    #  timeout: 60s
    #  retries: 20

    environment:
      AMQP_HOST: amqp://user:password@broker:5672/%2F

    networks:
      - appnet
    ports:
      - "8080:8080"
  
  # --- Additional infrastructure components ---
  broker:
    image: rabbitmq:management-alpine
    hostname: my-rabbit
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - appnet
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password
    #volumes:
    #  - ./enabled_plugins:/etc/rabbitmq/enabled_plugins:ro

  storage:
    networks:
      - appnet
    build: containers/infrastructure/storage
  
  # --- Consumer Services ---
  poll-service:
    build: containers/services/poll
    networks:
      - appnet
    environment:
      OPERATON_URL: http://engine:8080/engine-rest
    #depends_on:
      #engine:
        #condition: service_healthy
  
  push-service:
    networks:
      - appnet
    build: containers/services/push
  
  broker-service:
    networks:
      - appnet
    build: containers/services/push
    environment:
      AMQP_HOST: amqp://user:password@broker:5672/%2F
  
  storage-service:
    networks:
      - appnet
    build: containers/services/storage

  # --- Logging ---
  logging:
    pid: host
    networks:
      - appnet
    
    cap_add:
      - SYS_ADMIN

    security_opt:
      - seccomp:unconfined

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /sys:/sys:ro
      - ./config/testcases.jsonc:/app/config/config.jsonc
      - ./data/raw:/app/data
    build: containers/logging

    environment:
      OPERATON_URL: http://engine:8080/engine-rest
      AMQP_HOST: amqp://user:password@broker:5672/%2F
      SYSPATH: sys

networks:
  # This network is used for all test infrastructure
  appnet:
    name: appnet